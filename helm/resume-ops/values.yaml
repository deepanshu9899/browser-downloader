imagePullPolicy: IfNotPresent

frontend:
  image: resume-ops/frontend:latest
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    host: resume-ops.example.com
    annotations: {}
    tls:
      enabled: false
      secretName: ""

backend:
  image: resume-ops/backend:latest
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000

worker:
  image: resume-ops/worker:latest
  replicaCount: 1

redis:
  image: redis:7.4-alpine
  service:
    type: ClusterIP
    port: 6379
