imagePullPolicy: IfNotPresent

frontend:
  image: resume-ops/frontend:latest
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: private-nginx
    host: resume-ops.internal.example.com

backend:
  image: resume-ops/backend:latest
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000

worker:
  image: resume-ops/worker:latest
  replicaCount: 1

redis:
  image: redis:7.4-alpine
  service:
    type: ClusterIP
    port: 6379
